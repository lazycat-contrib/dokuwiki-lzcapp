version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: dokuwiki
build:
  toolchains: []
  run_buildscript: false
images:
  - id: dokuwiki
    target: service
    service: dokuwiki
    source: dokuwiki/dokuwiki
    channel: date
    sort: semver
    tag_regex: ^20[0-9]{2}-[0-9]{2}-[0-9]{2}[a-z]?$
    version_regex: ^(?P<year>20[0-9]{2})-(?P<month>[0-9]{2})-(?P<day>[0-9]{2})[a-z]?$
    version_template: '{year}.{month}.{day}'
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: DokuWiki
    skip_if_version_exists: true
